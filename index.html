<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>You're Invited! 🎉</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body { 
      width: 100vw; 
      min-height: 100vh; 
      font-family: sans-serif; 
      background: #fdfbf7; 
      overflow-x: hidden;
    }

    .main-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 10px; /* Padding dikecilin biar foto lebih penuh */
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /* PENGATURAN GRID FOTO (3 BARIS) */
    .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 2 Kolom */
      gap: 8px; /* Jarak antar foto */
      width: 100%;
      max-width: 600px;
      margin-bottom: 25px;
    }

    .photo-grid img {
      width: 100%;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    /* BARIS 1 & 3 (FOTO BESAR) */
    .img-large { height: 220px; }

    /* BARIS 2 (FOTO KECIL) - Dibagi 4 kolom */
    .grid-middle {
      grid-column: span 2; /* Ambil lebar penuh */
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px;
    }
    .grid-middle img { height: 120px; }

    /* TEKS UNDANGAN */
    .pre-title { font-size: 1.1rem; color: #ff477e; font-weight: bold; margin-bottom: 5px; }
    .title { font-size: 2.2rem; line-height: 1.2; margin-bottom: 10px; color: #222; }
    .title span { color: #ff477e; }
    .subtitle { font-size: 1.1rem; margin-bottom: 25px; color: #555; }

    /* TOMBOL */
    .btn-group { display: flex; gap: 15px; justify-content: center; width: 100%; margin-bottom: 30px;}
    .btn { padding: 14px 25px; font-size: 1.1rem; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
    
    .btn.yes { 
      background: #ff477e; 
      color: white; 
      box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4); 
      animation: pulse 1.5s infinite; 
    }
    .btn.no { 
      background: #eee; 
      color: #333; 
      border: 2px solid #ccc; 
    }

    /* POPUP */
    .popup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
    .popup.active { display: flex; }
    .popup-content { background: white; padding: 25px; border-radius: 20px; max-width: 350px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .popup-content h2 { color: #ff477e; margin-bottom: 10px; font-size: 1.4rem; }
    
    .details { 
      background: #f5f5f5; padding: 15px; border-radius: 15px; margin: 15px 0; 
      color: #333; font-size: 0.95rem; text-align: left;
    }
    .details p { margin-bottom: 8px; }
    .details p:last-child { margin-bottom: 0; }
    .location a { color: #ff477e; font-weight: bold; text-decoration: none; display: inline-block; margin-top: 5px;}

    /* PARTIKEL */
    .balloon-emoji, .confetti { position: fixed; bottom: -100px; pointer-events: none; z-index: 5; }
    .balloon-emoji { font-size: 45px; animation: floatUp linear forwards; }
    .confetti { width: 10px; height: 20px; animation: fallDown linear forwards; }

    @keyframes floatUp { 0% { transform: translateY(0) rotate(-15deg); opacity: 1; } 100% { transform: translateY(-120vh) translateX(30px) rotate(15deg); opacity: 0; } }
    @keyframes fallDown { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(120vh) rotate(720deg); opacity: 0; } }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    /* LAYAR HP KECIL (BIAR TETAP RAPI) */
    @media (max-width: 600px) {
      .img-large { height: 150px; }
      .grid-middle img { height: 80px; }
      .title { font-size: 1.6rem; }
      .pre-title { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div id="particle-container"></div>

  <div class="main-container">
    
    <!-- KOLASE 8 FOTO -->
    <div class="photo-grid">
      <!-- Baris 1: Kiri Kanan Gede -->
      <img src="foto5.jpg" class="img-large" alt="Foto 5">
      <img src="foto6.jpg" class="img-large" alt="Foto 6">

      <!-- Baris 2: 4 Foto Kecil di Tengah -->
      <div class="grid-middle">
        <img src="foto1.jpg" alt="Foto 1">
        <img src="foto2.jpg" alt="Foto 2">
        <img src="foto3.jpg" alt="Foto 3">
        <img src="foto4.jpg" alt="Foto 4">
      </div>

      <!-- Baris 3: Kiri Kanan Gede -->
      <img src="foto7.jpg" class="img-large" alt="Foto 7">
      <img src="foto8.jpg" class="img-large" alt="Foto 8">
    </div>

    <div class="pre-title">🎉 It's Danish's and Dymi's birthday! 🥳</div>
    <div class="title">You are invited to<br><span>Our Birthday Party</span> 🎂</div>
    <div class="subtitle">Come and celebrate with us! 🎈</div>

    <div class="btn-group">
      <button id="yesBtn" class="btn yes">Will You Come? 💖</button>
      <button id="noBtn" class="btn no">No 😢</button>
    </div>
  </div>

  <div id="popup" class="popup">
    <div class="popup-content">
      <h2>Yay! See you there! 🎉</h2>
      <p>Here are the party details:</p>
      
      <div class="details">
        <p><strong>📍 Rubin Loft</strong><br>Rubinshteyna Street, 20</p>
        <p><strong>⏰ Time:</strong> 13.00 (1:00 PM)</p>
        <p><strong>👕 Dress Code:</strong> Putih / White</p>
        <div class="location">
          <a href="https://yandex.com/maps/org/rubin_loft/69663974910?si=q5rw18f5hvua8xh899q4516nkc" target="_blank">Open in Maps 🗺️</a>
        </div>
      </div>

      <button onclick="closePopup()" class="btn yes">Close</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const popup = document.getElementById('popup');
    const container = document.getElementById('particle-container');
    const colors = ['#ff477e', '#ffd166', '#06d6a0', '#118ab2', '#ef476f', '#8338ec', '#ff9f1c'];

    function createBalloon(isMassive = false) {
      const b = document.createElement('div');
      b.className = 'balloon-emoji';
      const emojis = ['🎈', '🎈', '🎈', '🎈', '🎊', '✨', '🎉'];
      b.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      b.style.left = Math.random() * 100 + 'vw';
      b.style.fontSize = isMassive ? (Math.random() * 20 + 40) + 'px' : (Math.random() * 15 + 25) + 'px';
      const duration = isMassive ? (Math.random() * 2 + 2) : (Math.random() * 3 + 4);
      b.style.animationDuration = duration + 's';
      container.appendChild(b);
      setTimeout(() => { b.remove(); }, duration * 1000);
    }

    function createConfetti(isMassive = false) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      c.style.left = Math.random() * 100 + 'vw';
      if(Math.random() > 0.5) c.style.borderRadius = '50%';
      const duration = isMassive ? (Math.random() * 1.5 + 1.5) : (Math.random() * 2 + 3);
      c.style.animationDuration = duration + 's';
      container.appendChild(c);
      setTimeout(() => { c.remove(); }, duration * 1000);
    }

    setInterval(() => { 
      createBalloon(); 
      createConfetti();
    }, 200);

    noBtn.addEventListener('mouseover', () => {
      noBtn.style.position = 'fixed';
      noBtn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
      noBtn.style.top = Math.random() * (window.innerHeight - 50) + 'px';
    });

    yesBtn.addEventListener('click', () => {
      popup.classList.add('active');
      for (let i = 0; i < 80; i++) {
        setTimeout(() => { createBalloon(true); createConfetti(true); }, i * 20);
      }
    });

    function closePopup() { popup.classList.remove('active'); }
  </script>
</body>
</html>
