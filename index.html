<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- INI KUNCI ANTI ZOOM DI HP -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>You're Invited! 🎉</title>
  <style>
    /* Kunci anti zoom level browser */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Biar gak bisa digeser ngaco */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      touch-action: manipulation; /* Cegah double tap zoom */
    }

    body {
      font-family: sans-serif;
      text-align: center;
      background: url('foto.jpg') center/cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .overlay {
      width: 100%;
      max-height: 100%;
      overflow-y: auto; /* Kalau layar HP pendek, kotak bisa discroll */
      padding: 20px 15px 40px 15px;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 80%, transparent 100%);
      z-index: 10;
      box-sizing: border-box;
    }

    .text-container { max-width: 600px; margin: 0 auto; color: white; }

    .pre-title { font-size: 1.1rem; margin-bottom: 8px; color: #ffd166; text-shadow: 2px 2px 5px #000; font-weight: bold; }

    .title { font-size: 2rem; line-height: 1.2; margin-bottom: 10px; text-shadow: 2px 2px 8px #000; }
    .title span { color: #ffd166; font-weight: bold; }

    .subtitle { font-size: 1rem; margin-bottom: 20px; text-shadow: 2px 2px 5px #000; }

    .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn { padding: 12px 20px; font-size: 1rem; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
    
    .btn.yes { background: #ff477e; color: white; box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4); animation: pulse 1.5s infinite; }
    .btn.no { background: rgba(0,0,0,0.6); color: white; border: 2px solid white; }

    /* Popup */
    .popup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 9999; }
    .popup.active { display: flex; }
    .popup-content { background: white; padding: 25px; border-radius: 20px; max-width: 90%; width: 350px; box-sizing: border-box; }
    .popup-content h2 { color: #ff477e; margin-bottom: 10px; font-size: 1.5rem;}
    .location { background: #f0f0f0; padding: 15px; border-radius: 15px; margin: 15px 0; color: #333; font-size: 0.9rem;}
    .location a { color: #ff477e; font-weight: bold; text-decoration: none; }

    /* Balon & Confetti */
    .balloon-emoji, .confetti { position: absolute; bottom: -100px; pointer-events: none; z-index: 99; }
    .balloon-emoji { font-size: 50px; animation: floatUp linear forwards; }
    .confetti { width: 10px; height: 20px; animation: fallDown linear forwards; }

    @keyframes floatUp { 0% { transform: translateY(0) rotate(-15deg); opacity: 1; } 50% { transform: translateY(-50vh) translateX(20px) rotate(15deg); } 100% { transform: translateY(-120vh) translateX(-20px) rotate(-15deg); opacity: 0; } }
    @keyframes fallDown { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(120vh) rotate(720deg); opacity: 0; } }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    /* KHUSUS LAYAR HP YANG LEBIH KECIL */
    @media (max-width: 400px) {
      .title { font-size: 1.6rem; }
      .pre-title { font-size: 0.9rem; }
      .subtitle { font-size: 0.85rem; }
      .btn { padding: 10px 15px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div id="particle-container"></div>

  <div class="overlay">
    <div class="text-container">
      <h2 class="pre-title">🎉 It's Danish's and Dymi's birthday! 🥳</h2>
      <h1 class="title">You are invited to<br><span>Our Birthday Party</span> 🎂</h1>
      <p class="subtitle">Come and celebrate with us! 🎈</p>
      <div class="btn-group">
        <button id="yesBtn" class="btn yes">Will You Come? 💖</button>
        <button id="noBtn" class="btn no">No 😢</button>
      </div>
    </div>
  </div>

  <div id="popup" class="popup">
    <div class="popup-content">
      <h2>Yay! See you there! 🎉</h2>
      <div class="location">
        <p><strong>📍 Rubin Loft</strong></p>
        <p>Rubinshteyna Street, 20</p>
        <a href="https://yandex.com/maps/org/rubin_loft/69663974910?si=q5rw18f5hvua8xh899q4516nkc" target="_blank">Open in Maps 🗺️</a>
      </div>
      <button onclick="closePopup()" class="btn yes">Close</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const popup = document.getElementById('popup');
    const container = document.getElementById('particle-container');
    const colors = ['#ff477e', '#ffd166', '#06d6a0', '#118ab2', '#ef476f', '#8338ec', '#ff9f1c'];

    function createBalloon(isMassive = false) {
      const b = document.createElement('div');
      b.className = 'balloon-emoji';
      const emojis = ['🎈', '🎈', '🎈', '🎈', '🎊', '✨', '🎉'];
      b.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      b.style.left = Math.random() * 100 + 'vw';
      b.style.fontSize = isMassive ? (Math.random() * 30 + 40) + 'px' : (Math.random() * 20 + 30) + 'px';
      const duration = isMassive ? (Math.random() * 2 + 2) : (Math.random() * 3 + 4);
      b.style.animationDuration = duration + 's';
      container.appendChild(b);
      setTimeout(() => { b.remove(); }, duration * 1000);
    }

    function createConfetti(isMassive = false) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      c.style.left = Math.random() * 100 + 'vw';
      if(Math.random() > 0.5) c.style.borderRadius = '50%';
      const duration = isMassive ? (Math.random() * 1.5 + 1.5) : (Math.random() * 2 + 3);
      c.style.animationDuration = duration + 's';
      container.appendChild(c);
      setTimeout(() => { c.remove(); }, duration * 1000);
    }

    setInterval(() => { 
      createBalloon(); 
      createConfetti();
      setTimeout(() => createConfetti(), 100); 
    }, 150);

    noBtn.addEventListener('mouseover', () => {
      noBtn.style.position = 'fixed';
      noBtn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
      noBtn.style.top = Math.random() * (window.innerHeight - 50) + 'px';
    });

    yesBtn.addEventListener('click', () => {
      popup.classList.add('active');
      for (let i = 0; i < 100; i++) {
        setTimeout(() => { createBalloon(true); createConfetti(true); }, i * 15);
      }
    });

    function closePopup() { popup.classList.remove('active'); }
  </script>
</body>
</html>
