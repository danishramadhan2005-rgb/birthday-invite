<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Invited! 🎉</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: sans-serif;
      text-align: center;
      overflow: hidden;
      background: url('foto.jpg') center/cover no-repeat fixed;
    }

    /* Efek kaca gelap di bawah biar teks jelas */
    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 30px 20px 50px 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
      z-index: 10;
    }

    .text-container { max-width: 600px; margin: 0 auto; color: white; }

    .pre-title { 
      font-size: 1.2rem; margin-bottom: 10px; color: #ffd166; 
      text-shadow: 0 0 10px #ffd166; font-weight: bold; 
    }

    /* EFEK GLITTER DI TULISAN */
    .title { 
      font-size: 2.5rem; line-height: 1.2; margin-bottom: 10px; 
      text-shadow: 2px 2px 8px #000; 
    }
    .title span { 
      color: #ffd166;
      background: linear-gradient(90deg, #ff6b9d, #ffd166, #06d6a0, #118ab2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
      font-weight: 900;
    }

    .subtitle { font-size: 1.1rem; margin-bottom: 25px; text-shadow: 2px 2px 5px #000; }

    .btn-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
    
    .btn { padding: 12px 25px; font-size: 1rem; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    
    /* EFEK TOMBOL YES GOYANG */
    .btn.yes { 
      background: #ff477e; color: white; 
      box-shadow: 0 0 15px rgba(255, 71, 126, 0.8); 
      animation: pulse 1.5s infinite;
    }
    .btn.yes:hover { transform: scale(1.15); }
    
    .btn.no { background: rgba(0,0,0,0.6); color: white; border: 2px solid white; }

    /* Popup */
    .popup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 9999; }
    .popup.active { display: flex; }
    .popup-content { background: white; padding: 30px; border-radius: 20px; max-width: 400px; position: relative;}
    .popup-content h2 { color: #ff477e; margin-bottom: 10px; }
    .location { background: #f0f0f0; padding: 15px; border-radius: 15px; margin: 15px 0; color: #333; }
    .location a { color: #ff477e; font-weight: bold; text-decoration: none; }

    /* ==== BALON & CONFETTI ==== */
    .balloon-emoji, .confetti {
      position: absolute;
      bottom: -100px;
      pointer-events: none;
      z-index: 99;
    }

    .balloon-emoji { font-size: 60px; animation: floatUp linear forwards; }
    
    .confetti {
      width: 10px; height: 20px;
      animation: fallDown linear forwards;
    }

    /* ANIMASI BALON NAIK SAMBIL GOYANG */
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(-15deg); opacity: 1; }
      50% { transform: translateY(-50vh) translateX(20px) rotate(15deg); }
      100% { transform: translateY(-120vh) translateX(-20px) rotate(-15deg); opacity: 0; }
    }

    /* ANIMASI CONFETTI JATUH MUTER */
    @keyframes fallDown {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(120vh) rotate(720deg); opacity: 0; }
    }

    /* ANIMASI TOMBOL YES */
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 71, 126, 0.6); }
      50% { transform: scale(1.08); box-shadow: 0 0 25px rgba(255, 71, 126, 1); }
      100% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 71, 126, 0.6); }
    }
  </style>
</head>
<body>

  <div id="particle-container"></div>

  <div class="overlay">
    <div class="text-container">
      <h2 class="pre-title">🎉 It's Danish's and Dymi's birthday! 🥳</h2>
      <h1 class="title">You are invited to<br><span>Our Birthday Party</span> 🎂</h1>
      <p class="subtitle">Come and celebrate with us! 🎈</p>
      
      <div class="btn-group">
        <button id="yesBtn" class="btn yes">Will You Come? 💖</button>
        <button id="noBtn" class="btn no">No 😢</button>
      </div>
    </div>
  </div>

  <div id="popup" class="popup">
    <div class="popup-content">
      <h2>Yay! See you there! 🎉</h2>
      <div class="location">
        <p><strong>📍 Rubin Loft</strong></p>
        <p>Rubinshteyna Street, 20</p>
        <a href="https://yandex.com/maps/org/rubin_loft/69663974910?si=q5rw18f5hvua8xh899q4516nkc" target="_blank">Open in Maps 🗺️</a>
      </div>
      <button onclick="closePopup()" class="btn yes">Close</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const popup = document.getElementById('popup');
    const container = document.getElementById('particle-container');

    const colors = ['#ff477e', '#ffd166', '#06d6a0', '#118ab2', '#ef476f', '#8338ec', '#ff9f1c'];

    // Fungsi Bikin Balon
    function createBalloon(isMassive = false) {
      const b = document.createElement('div');
      b.className = 'balloon-emoji';
      
      // Random pilih emoji balon
      const emojis = ['🎈', '🎈', '🎈', '🎈', '🎊', '✨', '🎉'];
      b.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      
      b.style.left = Math.random() * 100 + 'vw';
      b.style.fontSize = isMassive ? (Math.random() * 40 + 60) + 'px' : (Math.random() * 30 + 40) + 'px';
      
      const duration = isMassive ? (Math.random() * 2 + 3) : (Math.random() * 3 + 5);
      b.style.animationDuration = duration + 's';
      
      container.appendChild(b);
      setTimeout(() => { b.remove(); }, duration * 1000);
    }

    // Fungsi Bikin Confetti
    function createConfetti(isMassive = false) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      c.style.left = Math.random() * 100 + 'vw';
      
      // Bentuk random (kotak atau bulat)
      if(Math.random() > 0.5) c.style.borderRadius = '50%';
      
      const duration = isMassive ? (Math.random() * 1 + 2) : (Math.random() * 2 + 3);
      c.style.animationDuration = duration + 's';
      
      container.appendChild(c);
      setTimeout(() => { c.remove(); }, duration * 1000);
    }

    // Tiap 0.4 detik munculin balon & confetti
    setInterval(() => { 
      createBalloon(); 
      createConfetti();
    }, 400);

    // Tombol No kabur
    noBtn.addEventListener('mouseover', () => {
      noBtn.style.position = 'fixed';
      noBtn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
      noBtn.style.top = Math.random() * (window.innerHeight - 50) + 'px';
    });

    // Pas YES dipencet, tembak balon & confetti banyak banget
    yesBtn.addEventListener('click', () => {
      popup.classList.add('active');
      for (let i = 0; i < 80; i++) {
        setTimeout(() => { 
          createBalloon(true); 
          createConfetti(true);
        }, i * 20);
      }
    });

    function closePopup() { popup.classList.remove('active'); }
  </script>
</body>
</html>
