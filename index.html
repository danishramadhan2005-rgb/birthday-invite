<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>You're Invited! 🎉</title>
  <style>
    /* KUNCI MATI ANTI ZOOM & SCROLL */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      touch-action: pan-y; 
      font-family: sans-serif; 
      background: #111;
    }

    .bg-image {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: url('foto.jpg') center center / cover no-repeat;
      z-index: 1;
    }

    .overlay {
      position: fixed;
      bottom: 0; left: 0; width: 100vw;
      padding: 15px 15px 30px 15px;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 70%, transparent 100%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .text-container { width: 100%; max-width: 600px; color: white; text-align: center; }

    .pre-title { font-size: 1rem; margin-bottom: 5px; color: #ffd166; font-weight: bold; text-shadow: 1px 1px 4px #000; }
    .title { font-size: 1.6rem; line-height: 1.2; margin-bottom: 8px; text-shadow: 2px 2px 6px #000; }
    .title span { color: #ffd166; }
    .subtitle { font-size: 0.9rem; margin-bottom: 15px; text-shadow: 1px 1px 4px #000; }

    .btn-group { display: flex; gap: 10px; justify-content: center; width: 100%; }
    .btn { padding: 10px 18px; font-size: 0.85rem; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
    .btn.yes { background: #ff477e; color: white; animation: pulse 1.5s infinite; flex: 1; max-width: 150px; }
    .btn.no { background: rgba(0,0,0,0.6); color: white; border: 2px solid white; flex: 1; max-width: 100px;}

    /* POPUP */
    .popup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
    .popup.active { display: flex; }
    .popup-content { background: white; padding: 20px; border-radius: 20px; max-width: 350px; width: 100%; text-align: center; }
    .popup-content h2 { color: #ff477e; margin-bottom: 10px; font-size: 1.3rem; }
    .location { background: #f0f0f0; padding: 12px; border-radius: 15px; margin: 10px 0; color: #333; font-size: 0.8rem; }
    .location a { color: #ff477e; font-weight: bold; text-decoration: none; }

    /* PARTIKEL */
    .balloon-emoji, .confetti { position: absolute; bottom: -100px; pointer-events: none; z-index: 99; }
    .balloon-emoji { font-size: 40px; animation: floatUp linear forwards; }
    .confetti { width: 8px; height: 16px; animation: fallDown linear forwards; }

    @keyframes floatUp { 0% { transform: translateY(0) rotate(-15deg); opacity: 1; } 100% { transform: translateY(-120vh) translateX(30px) rotate(15deg); opacity: 0; } }
    @keyframes fallDown { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(120vh) rotate(720deg); opacity: 0; } }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    /* LAYAR GEDE (LAPTOP) */
    @media (min-width: 600px) {
      .pre-title { font-size: 1.3rem; }
      .title { font-size: 2.5rem; }
      .subtitle { font-size: 1.1rem; margin-bottom: 25px; }
      .btn { padding: 12px 25px; font-size: 1rem; }
      .overlay { padding: 30px 20px 50px 20px; }
    }
  </style>
</head>
<body>

  <div class="bg-image"></div>
  <div id="particle-container"></div>

  <div class="overlay">
    <div class="text-container">
      <div class="pre-title">🎉 It's Danish's and Dymi's birthday! 🥳</div>
      <div class="title">You are invited to<br><span>Our Birthday Party</span> 🎂</div>
      <div class="subtitle">Come and celebrate with us! 🎈</div>
      <div class="btn-group">
        <button id="yesBtn" class="btn yes">Will You Come? 💖</button>
        <button id="noBtn" class="btn no">No 😢</button>
      </div>
    </div>
  </div>

  <div id="popup" class="popup">
    <div class="popup-content">
      <h2>Yay! See you there! 🎉</h2>
      <div class="location">
        <p><strong>📍 Rubin Loft</strong></p>
        <p>Rubinshteyna Street, 20</p>
        <a href="https://yandex.com/maps/org/rubin_loft/69663974910?si=q5rw18f5hvua8xh899q4516nkc" target="_blank">Open in Maps 🗺️</a>
      </div>
      <button onclick="closePopup()" class="btn yes">Close</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const popup = document.getElementById('popup');
    const container = document.getElementById('particle-container');
    const colors = ['#ff477e', '#ffd166', '#06d6a0', '#118ab2', '#ef476f', '#8338ec', '#ff9f1c'];

    function createBalloon(isMassive = false) {
      const b = document.createElement('div');
      b.className = 'balloon-emoji';
      const emojis = ['🎈', '🎈', '🎈', '🎈', '🎊', '✨', '🎉'];
      b.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      b.style.left = Math.random() * 100 + 'vw';
      b.style.fontSize = isMassive ? (Math.random() * 20 + 40) + 'px' : (Math.random() * 15 + 25) + 'px';
      const duration = isMassive ? (Math.random() * 2 + 2) : (Math.random() * 3 + 4);
      b.style.animationDuration = duration + 's';
      container.appendChild(b);
      setTimeout(() => { b.remove(); }, duration * 1000);
    }

    function createConfetti(isMassive = false) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      c.style.left = Math.random() * 100 + 'vw';
      if(Math.random() > 0.5) c.style.borderRadius = '50%';
      const duration = isMassive ? (Math.random() * 1.5 + 1.5) : (Math.random() * 2 + 3);
      c.style.animationDuration = duration + 's';
      container.appendChild(c);
      setTimeout(() => { c.remove(); }, duration * 1000);
    }

    setInterval(() => { 
      createBalloon(); 
      createConfetti();
      setTimeout(() => createConfetti(), 100); 
    }, 150);

    noBtn.addEventListener('mouseover', () => {
      noBtn.style.position = 'fixed';
      noBtn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
      noBtn.style.top = Math.random() * (window.innerHeight - 50) + 'px';
    });

    yesBtn.addEventListener('click', () => {
      popup.classList.add('active');
      for (let i = 0; i < 100; i++) {
        setTimeout(() => { createBalloon(true); createConfetti(true); }, i * 15);
      }
    });

    function closePopup() { popup.classList.remove('active'); }
  </script>
</body>
</html>
