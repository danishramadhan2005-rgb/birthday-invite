<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Invited! 🎉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tempat Balon -->
  <div id="balloon-container"></div>

  <!-- Layout baru: Teks di bawah biar muka lu kelihatan -->
  <div class="overlay">
    <div class="text-container">
      <h2 class="pre-title">It's Danish's and Dymi's birthday!</h2>
      <h1 class="title">You are invited to<br><span>Our Birthday Party</span> 🎂</h1>
      <p class="subtitle">Come and celebrate with us! 🎈</p>
      
      <div class="btn-group">
        <button id="yesBtn" class="btn yes">Will You Come? 💖</button>
        <button id="noBtn" class="btn no">No 😢</button>
      </div>
    </div>
  </div>

  <!-- Popup pas pencet YES (Alamat muncul di sini) -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <h2>Yay! See you there! 🎉</h2>
      <p>Here are the party details:</p>
      
      <div class="location-popup">
        <p><strong>📍 Rubin Loft</strong></p>
        <p>Rubinshteyna Street, 20</p>
        <a href="https://yandex.com/maps/org/rubin_loft/69663974910?si=q5rw18f5hvua8xh899q4516nkc" target="_blank" class="map-link">Open in Maps 🗺️</a>
      </div>

      <button onclick="closePopup()" class="btn yes">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
