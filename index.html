<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Invited! 🎉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">You're Invited to<br><span>My Birthday Party</span> 🎂</h1>
    <p class="subtitle">Save the date & celebrate with me!</p>
    
    <div class="btn-group">
      <button id="yesBtn" class="btn yes">Will You Come? 💖</button>
      <button id="noBtn" class="btn no">No 😢</button>
    </div>
  </div>

  <!-- Popup konfirmasi -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <h2>Yay! 🎉</h2>
      <p>Can't wait to see you there!</p>
      <button onclick="closePopup()" class="btn yes">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
