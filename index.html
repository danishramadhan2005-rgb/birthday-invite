<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>You're Invited! 🎉</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body { 
      width: 100vw; 
      min-height: 100vh; 
      font-family: sans-serif; 
      background: #fdfbf7; /* Warna putih tulang / krem manis */
      overflow-x: hidden;
    }

    /* Wadah utama biar ke tengah */
    .main-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /* GRID 4 FOTO */
    .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* Dibagi 2 kolom */
      gap: 10px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 25px;
    }

    .photo-grid img {
      width: 100%;
      height: 200px; /* Tinggi foto disamain */
      object-fit: cover; /* Biar foto ga gepeng */
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* TEKS UNDANGAN */
    .pre-title { font-size: 1rem; color: #ff477e; font-weight: bold; margin-bottom: 5px; }
    .title { font-size: 2rem; line-height: 1.2; margin-bottom: 10px; color: #222; }
    .title span { color: #ff477e; }
    .subtitle { font-size: 1rem; margin-bottom: 25px; color: #555; }

    /* TOMBOL */
    .btn-group { display: flex; gap: 15px; justify-content: center; width: 100%; }
    .btn { padding: 12px 20px; font-size: 1rem; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
    
    .btn.yes { 
      background: #ff477e; 
      color: white; 
      box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4); 
      animation: pulse 1.5s infinite; 
    }
    .btn.no { 
      background: #eee; 
      color: #333; 
      border: 2px solid #ccc; 
    }

    /* POPUP (SAMA KAYAK SEBELUMNYA) */
    .popup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
    .popup.active { display: flex; }
    .popup-content { background: white; padding: 25px; border-radius: 20px; max-width: 350px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .popup-content h2 { color: #ff477e; margin-bottom: 10px; font-size: 1.4rem; }
    .location { background: #f5f5f5; padding: 15px; border-radius: 15px; margin: 15px 0; color: #333; font-size: 0.9rem; }
    .location a { color: #ff477e; font-weight: bold; text-decoration: none; }

    /* PARTIKEL (BALON & CONFETTI) */
    .balloon-emoji, .confetti { position: fixed; bottom: -100px; pointer-events: none; z-index: 5; }
    .balloon-emoji { font-size: 45px; animation: floatUp linear forwards; }
    .confetti { width: 10px; height: 20px; animation: fallDown linear forwards; }

    @keyframes floatUp { 0% { transform: translateY(0) rotate(-15deg); opacity: 1; } 100% { transform: translateY(-120vh) translateX(30px) rotate(15deg); opacity: 0; } }
    @keyframes fallDown { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(120vh) rotate(720deg); opacity: 0; } }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    /* LAYAR HP KECIL */
    @media (max-width: 450px) {
      .photo-grid img { height: 140px; }
      .title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <div id="particle-container"></div>

  <div class="main-container">
    
    <!-- 4 FOTO DI SINI -->
    <div class="photo-grid">
      <img src="foto1.jpg" alt="Foto 1">
      <img src="foto2.jpg" alt="Foto 2">
      <img src="foto3.jpg" alt="Foto 3">
      <img src="foto4.jpg" alt="Foto 4">
    </div>

    <div class="pre-title">🎉 It's Danish's and Dymi's birthday! 🥳</div>
    <div class="title">You are invited to<br><span>Our Birthday Party</span> 🎂</div>
    <div class="subtitle">Come and celebrate with us! 🎈</div>

    <div class="btn-group">
      <button id="yesBtn" class="btn yes">Will You Come? 💖</button>
      <button id="noBtn" class="btn no">No 😢</button>
    </div>
  </div>

  <div id="popup" class="popup">
    <div class="popup-content">
      <h2>Yay! See you there! 🎉</h2>
      <div class="location">
        <p><strong>📍 Rubin Loft</strong></p>
        <p>Rubinshteyna Street, 20</p>
        <a href="https://yandex.com/maps/org/rubin_loft/69663974910?si=q5rw18f5hvua8xh899q4516nkc" target="_blank">Open in Maps 🗺️</a>
      </div>
      <button onclick="closePopup()" class="btn yes">Close</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const popup = document.getElementById('popup');
    const container = document.getElementById('particle-container');
    const colors = ['#ff477e', '#ffd166', '#06d6a0', '#118ab2', '#ef476f', '#8338ec', '#ff9f1c'];

    function createBalloon(isMassive = false) {
      const b = document.createElement('div');
      b.className = 'balloon-emoji';
      const emojis = ['🎈', '🎈', '🎈', '🎈', '🎊', '✨', '🎉'];
      b.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      b.style.left = Math.random() * 100 + 'vw';
      b.style.fontSize = isMassive ? (Math.random() * 20 + 40) + 'px' : (Math.random() * 15 + 25) + 'px';
      const duration = isMassive ? (Math.random() * 2 + 2) : (Math.random() * 3 + 4);
      b.style.animationDuration = duration + 's';
      container.appendChild(b);
      setTimeout(() => { b.remove(); }, duration * 1000);
    }

    function createConfetti(isMassive = false) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      c.style.left = Math.random() * 100 + 'vw';
      if(Math.random() > 0.5) c.style.borderRadius = '50%';
      const duration = isMassive ? (Math.random() * 1.5 + 1.5) : (Math.random() * 2 + 3);
      c.style.animationDuration = duration + 's';
      container.appendChild(c);
      setTimeout(() => { c.remove(); }, duration * 1000);
    }

    setInterval(() => { 
      createBalloon(); 
      createConfetti();
    }, 200);

    noBtn.addEventListener('mouseover', () => {
      noBtn.style.position = 'fixed';
      noBtn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
      noBtn.style.top = Math.random() * (window.innerHeight - 50) + 'px';
    });

    yesBtn.addEventListener('click', () => {
      popup.classList.add('active');
      for (let i = 0; i < 80; i++) {
        setTimeout(() => { createBalloon(true); createConfetti(true); }, i * 20);
      }
    });

    function closePopup() { popup.classList.remove('active'); }
  </script>
</body>
</html>
